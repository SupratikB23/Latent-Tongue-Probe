# Offline pipeline check: tiny random GPT-2, CPU, a few minutes. Numbers are meaningless; only the plumbing is tested.

stimuli: data/stimuli.jsonl
cache_dir: cache_smoke
results_dir: results_smoke

models: [__tiny_random__]
concepts: [side, gender]
langs: [bn, hi, en]
source_lang: bn
target_lang: en
identity_lang: hi

seeds: [0, 1]
n_test_names: 6

device: cpu
dtype: float32
batch_size: 64

probe:
  C: 1.0
  max_iter: 500

ablation:
  mode: mean
  primary_layer: mid
  layer_stride: 2
  primary_rank: 1
  extra_ranks: [2]

thresholds:
  gate_clean_acc: 0.65
  support_gap: 0.15
  falsify_gap: 0.05
  random_max_drop: 0.03
  specificity_min: 0.03
  matched_margin: 0.05
